name: maket-production

x-app-build: &app-build
  context: .
  args:
    APP_URL: ${APP_URL:-}

x-app-environment: &app-environment
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-maket}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  POSTGRES_DB: ${POSTGRES_DB:-maket}
  POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
  APP_URL: ${APP_URL:-}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
  MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
  MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-maket}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    command: ['postgres', '-p', '${POSTGRES_PORT:-5432}']
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    image: maket-app:local
    build: *app-build
    command: ['node', 'scripts/migrate.mjs']
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'
    logging: *logging

  app:
    image: maket-app:local
    build: *app-build
    environment: *app-environment
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
