services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maket_local}
      POSTGRES_DB: maket
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - maket_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maket -d maket']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  maket_db:
