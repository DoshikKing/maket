name: Windows desktop smoke
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-windows-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      APP_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run build
      - run: npm --prefix desktop run smoke
